name: media_kit_libs_windows_audio
description: Windows native audio libraries for media_kit, with Flutify ARM64 support.
publish_to: none
version: 1.0.9
homepage: https://github.com/media-kit/media-kit.git
repository: https://github.com/media-kit/media-kit.git

environment:
  sdk: ">=2.17.0 <4.0.0"
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^2.0.0

flutter:
  plugin:
    platforms:
      windows:
        pluginClass: MediaKitLibsWindowsAudioPluginCApi
