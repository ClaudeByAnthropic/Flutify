# Independent, secret-free CI. Artifacts are not official releases.
name: Self-test

on:
  push:
    branches: ['**']
    paths-ignore: ['**.md', 'docs/**', 'LICENSE']
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: self-test-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

env:
  FLUTTER_VERSION: '3.44.0'

jobs:
  quality:
    name: Analyze and test
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      # Existing informational lints are reported; errors and warnings still fail.
      # Standalone diagnostic scripts in tool/ are outside the app analysis scope.
      - run: flutter analyze --no-pub --no-fatal-infos lib test
      - run: node --test tool/test_*.cjs
      - run: python3 -m unittest discover -s tool -p 'test_*.py'
      - run: flutter test --no-pub

  android:
    name: Android self-test APKs
    needs: quality
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      ANDROID_BUILD_NUMBER: '1'
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: ${{ env.FLUTTER_VERSION }}
          channel: stable
          cache: true
      - run: flutter pub get
      - name: Patch flutter_inappwebview_android for AGP 9
        run: |
          root=$(grep -o '"rootUri": *"file://[^"]*flutter_inappwebview_android-[^"]*"' .dart_tool/package_config.json \
            | sed -E 's/.*"file:\/\/([^"]*)"/\1/')
          sed -i "s/proguard-android.txt/proguard-android-optimize.txt/g" "$root/android/build.gradle"
          grep -n "proguard" "$root/android/build.gradle"
      - name: Create temporary self-test signing key
        run: bash tool/create_self_test_android_key.sh
      - name: Compile release-mode self-test APKs
        run: |
          flutter build apk --release --no-pub --split-per-abi --build-number="$ANDROID_BUILD_NUMBER"
          flutter build apk --release --no-pub --build-number="$ANDROID_BUILD_NUMBER"
      - name: Verify signatures, version codes and media icons
        run: python3 tool/verify_android_apks.py build/app/outputs/flutter-apk "$ANDROID_BUILD_NUMBER"
      - name: Remove temporary self-test key
        if: always()
        run: rm -f "$RUNNER_TEMP/flutify-self-test.p12"
      - name: Label self-test artifacts
        run: |
          mkdir -p dist/android
          for apk in build/app/outputs/flutter-apk/*-release.apk; do
            cp "$apk" "dist/android/Flutify-self-test-${GITHUB_SHA:0:7}-${apk##*/}"
          done
      - uses: actions/upload-artifact@v4
        with:
          name: self-test-android
          path: dist/android/*.apk
          if-no-files-found: error
          retention-days: 7
